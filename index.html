<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- offline-build: inserted only in the release build -->
  <title>ムダ連鎖 — MUDA RENSA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101c2b'/%3E%3Ctext x='5' y='25' font-size='25' fill='%23f5d778'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/style.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
  <main class="game-shell" aria-label="ムダ連鎖 ドローン吸収ゲーム">
    <canvas id="game" aria-label="指をずらして移動。止めてため、円を描いてハイパー放出。"></canvas>
    <header class="hud masthead">
      <div class="brand"><span class="brand-mark">M<span>↗</span></span><div><h1>MUDA RENSA</h1><p>ムダ連鎖</p></div></div>
      <div class="clock"><span class="eyebrow">SESSION</span><strong id="time">5:00</strong></div>
    </header>
    <section class="hud stats" aria-label="ゲーム状況">
      <div class="score-block"><span class="eyebrow">COLLECT / SCORE</span><strong id="score">0</strong></div>
      <div class="target-block"><div class="meter-label"><span>TARGET</span><strong id="hp">100%</strong></div><div class="meter target-meter"><div id="hp-fill"></div></div></div>
    </section>
    <div class="hud action-status"><span class="status-dot"></span><span id="mode">指をずらして移動</span></div>
    <footer class="hud controls">
      <div class="energy-row"><span class="eyebrow">ENERGY</span><strong id="energy">0</strong><span class="energy-caption">吸い込んで、解き放て。</span></div>
      <div class="meter energy-meter"><div id="energy-fill"></div></div>
      <div class="instructions"><span><b>01</b> ずらす：移動</span><span><b>02</b> 止める：ためる</span><span><b>03</b> 円を描く → 離す</span></div>
      <p class="prototype-note"><span id="save-status">続きはこの端末に保存されます</span> · <span id="offline-status">オフライン起動は準備前</span></p>
    </footer>
    <section id="overlay" class="overlay" hidden aria-live="polite">
      <div class="dialog"><span class="eyebrow">MUDA RENSA</span><h2 id="overlay-title">つづける？</h2><p id="overlay-text">集めたエネルギーで、もう一度。</p><div class="dialog-actions"><button id="continue-button" type="button">つづける</button><button id="restart-button" type="button">はじめから</button></div></div>
    </section>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
